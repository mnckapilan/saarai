<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 – Saarai</title>
    <!--
      Self-contained by design: this page is served for any unmatched path at
      any depth, so it must not reference relative assets. Its mere presence
      is what makes Cloudflare Pages return a real 404 status instead of
      falling back to index.html with a 200.
    -->
    <style>
      :root {
        --bg: #1e1e1e;
        --surface: #252526;
        --border: #3c3c3c;
        --text: #cccccc;
        --muted: #858585;
        --err: #f48771;
        --accent: #0078d4;
      }
      [data-theme='light'] {
        --bg: #ffffff;
        --surface: #f3f3f3;
        --border: #cecece;
        --text: #1f1f1f;
        --muted: #6f6f6f;
        --err: #cd3131;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 640px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .sub {
        margin: 0 0 20px;
        font-size: 13px;
        color: var(--muted);
      }
      pre {
        margin: 0 0 20px;
        padding: 16px;
        overflow-x: auto;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
        font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas,
          'Courier New', monospace;
        font-size: 13px;
        line-height: 1.6;
        color: var(--text);
      }
      pre .err {
        color: var(--err);
      }
      a {
        color: var(--accent);
        font-size: 13px;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404 &mdash; no such file or directory</h1>
      <p class="sub">Saarai &middot; browser-based Python IDE</p>
      <pre><code>Traceback (most recent call last):
  File "&lt;saarai.dev&gt;", line 1, in &lt;module&gt;
    open(<span id="path">"/"</span>)
<span class="err">FileNotFoundError: [Errno 2] No such file or directory</span></code></pre>
      <a href="/">&larr; Back to the editor</a>
    </main>
    <script>
      // Echo the requested path, set via textContent so it can never be markup.
      document.getElementById('path').textContent = JSON.stringify(
        location.pathname,
      )
      // Match the theme the visitor last chose in the IDE, if any.
      try {
        var t = localStorage.getItem('saarai:theme')
        if (t === 'light') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {
        /* localStorage unavailable (private browsing, etc.) */
      }
    </script>
  </body>
</html>
